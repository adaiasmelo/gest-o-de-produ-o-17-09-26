<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Redirecionando - Manupackaging</title>
  <script>
    (function() {
      try {
        var path = (window.location.pathname || '').toLowerCase();
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var href = (window.location.href || '').toLowerCase();
        var decodedPath = '';
        try { decodedPath = decodeURIComponent(path); } catch(e) { decodedPath = path; }

        // Redirecionamento da TV sem acento
        if (
          path.indexOf('tv') !== -1 ||
          path.indexOf('projecao') !== -1 ||
          decodedPath.indexOf('projeção') !== -1 ||
          search.indexOf('tv') !== -1 ||
          search.indexOf('projecao') !== -1 ||
          hash.indexOf('tv') !== -1 ||
          hash.indexOf('projecao') !== -1
        ) {
          try {
            localStorage.setItem('manupackaging_tv_mode', 'true');
          } catch(err) {}
          window.location.replace('/tv.html');
          return;
        }

        // Redirecionamento da Calculadora Cast 1
        if (
          path.indexOf('calculadora') !== -1 ||
          path.indexOf('cast1') !== -1 ||
          search.indexOf('calculadora') !== -1 ||
          search.indexOf('cast1') !== -1
        ) {
          window.location.replace('/calculadora.html');
          return;
        }

        // Se for qualquer outra página do sistema, redireciona para a raiz
        window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
      } catch(e) {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body style="background-color: #0f172a; color: #ffffff; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; margin: 0;">
  <p style="font-size: 16px; font-weight: bold; letter-spacing: 0.5px;">Carregando sistema...</p>
</body>
</html>
